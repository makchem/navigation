[project]
name = "navmod"
version = "0.1.0"
description = "GPS-denied optical navigation module for fixed-wing UAVs"
requires-python = ">=3.12"
dependencies = [
    "opencv-contrib-python>=4.10",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pyproj>=3.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ipython>=8.26",
    "pytest>=8.3",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipympl>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navmod"]
