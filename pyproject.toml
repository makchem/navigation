[project]
name = "navigation"
version = "0.1.0"
description = "AI-assisted visual navigation on a map without GPS"
requires-python = ">=3.12"
dependencies = [
    # Core vision. opencv-contrib-python bundles the main modules plus contrib
    # (xfeatures2d, tracking, optflow). Never install opencv-python alongside it.
    "opencv-contrib-python>=4.10",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    # Map/geo coordinate transforms (pixel <-> lat/lon, UTM, etc.)
    "pyproj>=3.6",
]

[dependency-groups]
dev = [
    "ipython>=8.26",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigation"]
